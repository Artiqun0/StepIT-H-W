<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertical Menu</title>
    <link rel="stylesheet" href="task2.css" />
  </head>

  <body>
    <ul class="vertical-menu">
      <li class="">
        <i class="fa-solid fa-pen" style="color: rgb(183, 144, 74)"></i>
        <span>EDIT</span>
      </li>
      <li class="list-item">
        <i class="fa-solid fa-heart" style="color: rgb(207, 21, 21)"></i>
        <span>FAVORITES</span>
      </li>
      <li class="list-item">
        <i class="fa-solid fa-clock" style="color: rgb(0, 191, 255)"></i>
        <span>HISTORY</span>
      </li>
      <li class="list-item">
        <i
          class="fa-solid fa-shield-halved"
          style="color: rgb(255, 255, 0)"
        ></i>
        <span>SECURITY</span>
      </li>
      <li class="list-item">
        <i class="fa-solid fa-sliders" style="color: rgb(0, 255, 0)"></i>
        <span>SETTINGS</span>
      </li>
    </ul>

    <script
      src="https://kit.fontawesome.com/82b7154170.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
